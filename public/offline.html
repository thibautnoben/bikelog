<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f0eee9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c0b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <title>Offline · Bikelog</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 1.5rem; background: #f0eee9; color: #1a1a18; }
      @media (prefers-color-scheme: dark) { body { background: #0c0c0b; color: #f0ece0; } button { background: #f0ece0; color: #0c0c0b; } }
      img { width: 96px; height: 96px; }
      button { font: inherit; border: 0; border-radius: 4px; background: #1a1a18; color: #f0eee9; font-weight: 600; padding: 0.7rem 1.4rem; min-height: 44px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon.svg" alt="" />
      <h1>You're offline</h1>
      <p>Bikelog needs a connection to load your bikes from Strava.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
